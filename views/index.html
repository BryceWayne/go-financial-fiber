<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Dashboard</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Color Palette */
            --bg-dark: #0f172a;
            --bg-darker: #0b1120;
            --accent-primary: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --accent-secondary: #c084fc;
            --accent-tertiary: #f43f5e;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            /* Glassmorphism */
            --glass-bg: rgba(30, 41, 59, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, var(--bg-dark) 40%, var(--bg-darker) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 3rem 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background blobs for dynamicity */
        body::before {
            content: '';
            position: fixed;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: var(--accent-secondary);
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            z-index: -1;
            animation: pulse 10s infinite alternate;
        }
        
        body::after {
            content: '';
            position: fixed;
            bottom: -150px;
            left: -100px;
            width: 500px;
            height: 500px;
            background: var(--accent-primary);
            border-radius: 50%;
            filter: blur(200px);
            opacity: 0.15;
            z-index: -1;
            animation: pulse 12s infinite alternate-reverse;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.1; }
            100% { transform: scale(1.2); opacity: 0.25; }
        }

        /* Container */
        .app-container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
        }
        
        .header-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2.5rem;
            background: linear-gradient(to right, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        /* Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem; /* Tighter gap */
        }
        @media (min-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Cards */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.25rem; /* Very slim inner padding */
            box-shadow: var(--glass-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Typography inside cards */
        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.75rem; /* Slimmer margin */
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .section-title::before {
            content: '';
            display: block;
            width: 4px;
            height: 20px;
            border-radius: 4px;
            background: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .sub-title {
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-top: 0.75rem; /* Minimal margin */
            margin-bottom: 0.25rem; /* Minimal margin */
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 0.15rem; /* Slim line padding */
            display: flex;
            justify-content: space-between;
        }

        /* Input Rows */
        .space-y {
            display: flex;
            flex-direction: column;
            gap: 0.15rem; /* Extremely tight row nesting */
            margin-bottom: 0.25rem;
        }

        .input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 0.1rem 0; /* Slim inner padding */
            transition: color 0.2s;
        }
        
        .input-row:hover {
            color: var(--text-primary);
        }

        .input-row label {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .text-xs {
            font-size: 0.7rem;
            opacity: 0.7;
        }

        /* Inputs */
        .input-field {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 0.2rem 0.4rem; /* Ultra slim padding */
            width: 100px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            text-align: right;
            transition: all 0.2s ease;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent-primary);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.2); /* Thinner focus ring */
        }
        
        /* Remove arrows from number input */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        select option {
            background: var(--bg-darker);
            color: var(--text-primary);
        }

        /* Total Bars */
        .total-bar {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2) 0%, rgba(56, 189, 248, 0.05) 100%);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 6px; /* Snappier corners */
            padding: 0.4rem 0.6rem; /* Slim padding */
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: var(--accent-primary);
            margin-top: 0.5rem; /* Negligible margin */
            margin-bottom: 0.75rem; /* Very tight spacing */
            font-size: 0.85rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }
        
        .total-bar.highlight {
            background: linear-gradient(135deg, var(--accent-primary) 0%, #0284c7 100%);
            color: #fff;
            border: none;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            font-size: 1rem;
            padding: 0.6rem 0.8rem;
        }
        
        .total-bar.secondary {
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.2) 0%, rgba(192, 132, 252, 0.05) 100%);
            border-color: rgba(192, 132, 252, 0.2);
            color: var(--accent-secondary);
        }

        .total-bar.tertiary {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.2) 0%, rgba(244, 63, 94, 0.05) 100%);
            border-color: rgba(244, 63, 94, 0.2);
            color: var(--accent-tertiary);
        }

        .total-bar span:last-child {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        
        .calculated-value {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Subtle HTMX indicator */
        .htmx-indicator {
            opacity: 0;
            transition: opacity 200ms ease-in;
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(30, 41, 59, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--accent-primary);
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 50;
            backdrop-filter: blur(4px);
        }
        .htmx-request .htmx-indicator {
            opacity: 1;
        }
        
        .htmx-request.htmx-indicator {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="htmx-indicator">Calculating...</div>
    
    <div class="app-container">
        <h1 class="header-title">Financial Dashboard</h1>

        <div id="dashboard-grid" class="dashboard-grid">
            {{ template "dashboard" . }}
        </div>
    </div>
</body>
</html>
